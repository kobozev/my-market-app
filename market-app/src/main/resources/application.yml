spring:
  application:
    name: my-market-app

  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:marketdb}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}

  sql:
    init:
      mode: never

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  thymeleaf:
    cache: false

cache:
  ttl: PT1M

payment:
  service:
    url: ${PAYMENT_SERVICE_URL:http://localhost:8081/api/v1}

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

logging:
  level:
    ru.yandex.practicum: DEBUG