server:
  port: 8080

spring:
  application:
    name: my-market-app

  spring:
    r2dbc:
      url: r2dbc:postgresql://localhost:5432/marketdb
      username: postgres
      password: postgres
    sql:
      init:
        mode: never

  thymeleaf:
    cache: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always